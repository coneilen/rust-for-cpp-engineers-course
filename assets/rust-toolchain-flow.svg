<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Rust toolchain and delivery flow</title>
  <desc id="desc">rustup installs compiler and standard library. Cargo combines source, manifest, lockfile, and registry crates to produce tests, debug output, and a target-specific release binary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="1080" height="420" fill="#ffffff"/>
  <text x="40" y="48" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1e1e1e">One standard path from setup to native binary</text>
  <rect x="40" y="115" width="190" height="105" rx="14" fill="#cfe4fa" stroke="#0078d4" stroke-width="3"/>
  <text x="135" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#000000">rustup</text>
  <text x="135" y="187" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#000000">toolchain + targets</text>
  <rect x="310" y="85" width="230" height="165" rx="14" fill="#fff4ce" stroke="#f7630c" stroke-width="3"/>
  <text x="425" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#000000">Cargo</text>
  <text x="425" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#000000">Cargo.toml</text>
  <text x="425" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#000000">Cargo.lock</text>
  <text x="425" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#000000">src/ + tests</text>
  <rect x="310" y="295" width="230" height="80" rx="14" fill="#f3f2f1" stroke="#1e1e1e" stroke-width="3"/>
  <text x="425" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#000000">Registry crates</text>
  <text x="425" y="356" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">versioned dependencies</text>
  <rect x="635" y="70" width="190" height="80" rx="14" fill="#dff6dd" stroke="#107c10" stroke-width="3"/>
  <text x="730" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#000000">cargo test</text>
  <text x="730" y="131" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">verified behavior</text>
  <rect x="635" y="170" width="190" height="80" rx="14" fill="#dff6dd" stroke="#107c10" stroke-width="3"/>
  <text x="730" y="205" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#000000">cargo run</text>
  <text x="730" y="231" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">debug executable</text>
  <rect x="635" y="270" width="190" height="105" rx="14" fill="#e8daef" stroke="#5c2d91" stroke-width="3"/>
  <text x="730" y="307" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#000000">cargo build</text>
  <text x="730" y="333" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#000000">--release</text>
  <text x="730" y="359" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">optimized binary</text>
  <rect x="895" y="270" width="150" height="105" rx="14" fill="#cfe4fa" stroke="#0078d4" stroke-width="3"/>
  <text x="970" y="307" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#000000">Distribute</text>
  <text x="970" y="333" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#000000">per OS + CPU</text>
  <text x="970" y="359" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#000000">no Rust required</text>
  <path d="M230 167 H300" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M425 295 V260" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M540 128 H625" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M540 183 H625" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M540 222 C580 222 585 322 625 322" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M825 322 H885" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
