<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
  <title id="title">Ownership and scoped concurrency</title>
  <desc id="desc">A vector owns strings. The render function borrows the vector as a slice. Scoped workers borrow individual names and must join before owned Result values return.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="1080" height="450" fill="#ffffff"/>
  <text x="40" y="46" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1e1e1e">Borrow local data only inside a lifetime the compiler can prove</text>
  <rect x="40" y="120" width="205" height="195" rx="14" fill="#cfe4fa" stroke="#0078d4" stroke-width="3"/>
  <text x="142" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#000000">Vec&lt;String&gt;</text>
  <text x="142" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#000000">owns all names</text>
  <rect x="72" y="216" width="140" height="34" rx="7" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="142" y="239" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#000000">"Ada"</text>
  <rect x="72" y="260" width="140" height="34" rx="7" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="142" y="283" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#000000">"Bjarne"</text>
  <rect x="315" y="140" width="190" height="155" rx="14" fill="#fff4ce" stroke="#f7630c" stroke-width="3"/>
  <text x="410" y="177" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#000000">&amp;[String]</text>
  <text x="410" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#000000">shared slice borrow</text>
  <text x="410" y="243" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">no move</text>
  <text x="410" y="268" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">no copy</text>
  <rect x="575" y="80" width="275" height="285" rx="14" fill="none" stroke="#5c2d91" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="712" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#000000">thread::scope</text>
  <rect x="610" y="145" width="205" height="70" rx="12" fill="#e8daef" stroke="#5c2d91" stroke-width="3"/>
  <text x="712" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#000000">worker 1</text>
  <text x="712" y="201" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#000000">borrows &amp;"Ada"</text>
  <rect x="610" y="240" width="205" height="70" rx="12" fill="#e8daef" stroke="#5c2d91" stroke-width="3"/>
  <text x="712" y="271" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#000000">worker 2</text>
  <text x="712" y="296" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#000000">borrows &amp;"Bjarne"</text>
  <text x="712" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#000000">all workers join here</text>
  <rect x="920" y="140" width="125" height="155" rx="14" fill="#dff6dd" stroke="#107c10" stroke-width="3"/>
  <text x="982" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#000000">Owned</text>
  <text x="982" y="206" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#000000">Vec&lt;Result</text>
  <text x="982" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#000000">&lt;String,</text>
  <text x="982" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#000000">NameError&gt;&gt;</text>
  <path d="M245 218 H305" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M505 218 H565" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M850 218 H910" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M850 338 C900 338 875 390 790 390 H170 C105 390 105 340 142 325" fill="none" stroke="#107c10" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="505" y="419" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#000000">after join, the owner can be used, changed, or dropped again</text>
</svg>
