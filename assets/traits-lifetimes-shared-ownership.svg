<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Trait dispatch, lifetimes, and shared ownership</title>
  <desc id="desc">A Formatter trait branches to static generic dispatch or dynamic trait-object dispatch. A runtime-selected formatter is owned by Arc and cloned into scoped workers, while each worker borrows a name that cannot outlive the thread scope.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="1120" height="520" fill="#ffffff"/>
  <text x="40" y="46" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1e1e1e">One behavior contract, explicit choices for dispatch and ownership</text>

  <rect x="40" y="110" width="220" height="100" rx="14" fill="#cfe4fa" stroke="#0078d4" stroke-width="3"/>
  <text x="150" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#000000">Formatter trait</text>
  <text x="150" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#000000">format(&amp;self, &amp;str)</text>

  <rect x="350" y="75" width="255" height="120" rx="14" fill="#dff6dd" stroke="#107c10" stroke-width="3"/>
  <text x="477" y="113" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#000000">Static dispatch</text>
  <text x="477" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#000000">F: Formatter</text>
  <text x="477" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">monomorphized per type</text>

  <rect x="350" y="235" width="255" height="120" rx="14" fill="#e8daef" stroke="#5c2d91" stroke-width="3"/>
  <text x="477" y="273" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#000000">Dynamic dispatch</text>
  <text x="477" y="305" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#000000">dyn Formatter</text>
  <text x="477" y="334" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">runtime-selected type</text>

  <rect x="700" y="235" width="180" height="120" rx="14" fill="#fff4ce" stroke="#f7630c" stroke-width="3"/>
  <text x="790" y="273" text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#000000">Arc&lt;dyn ...&gt;</text>
  <text x="790" y="305" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">shared ownership</text>
  <text x="790" y="333" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">atomic count</text>

  <rect x="950" y="75" width="130" height="95" rx="14" fill="#e8daef" stroke="#5c2d91" stroke-width="3"/>
  <text x="1015" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#000000">Worker 1</text>
  <text x="1015" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#000000">Arc clone</text>

  <rect x="950" y="210" width="130" height="95" rx="14" fill="#e8daef" stroke="#5c2d91" stroke-width="3"/>
  <text x="1015" y="247" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#000000">Worker 2</text>
  <text x="1015" y="277" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#000000">Arc clone</text>

  <rect x="950" y="345" width="130" height="95" rx="14" fill="#e8daef" stroke="#5c2d91" stroke-width="3"/>
  <text x="1015" y="382" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#000000">Worker 3</text>
  <text x="1015" y="412" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#000000">Arc clone</text>

  <rect x="250" y="415" width="520" height="70" rx="14" fill="#f3f2f1" stroke="#1e1e1e" stroke-width="3"/>
  <text x="510" y="444" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#000000">Greeting&lt;'a&gt; borrows name: &amp;'a str</text>
  <text x="510" y="470" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#000000">the result cannot outlive the borrowed name</text>

  <path d="M260 145 C300 145 310 135 340 135" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M260 175 C300 175 310 295 340 295" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M605 295 H690" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880 295 C920 295 910 123 940 123" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880 295 H940" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880 295 C920 295 910 392 940 392" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1015 440 V477 H780" fill="none" stroke="#107c10" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="925" y="492" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#000000">scope joins before borrows end</text>
</svg>
